<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f34b1b"><title>Dashboard Siswa - AB Garage</title><link rel="stylesheet" href="style.css">
<style>
.dashboard{max-width:1100px;margin:auto;padding:28px 18px}.dash-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.dash-head h1{margin:.2rem 0}.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.panel{background:#fff;border:1px solid #e8e8e8;border-radius:18px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,.05)}.stat strong{display:block;font-size:28px;margin-top:6px}.module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.module{border:1px solid #eee;border-radius:16px;padding:15px}.bar{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#f34b1b}.muted{color:#777}.danger{color:#b42318}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.student-only{font-size:12px;font-weight:700;letter-spacing:.08em;color:#f34b1b}@media(max-width:800px){.dash-grid,.module-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.dash-grid,.module-grid{grid-template-columns:1fr}.dash-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="dashboard" id="studentApp" hidden>
<header class="dash-head"><div><p class="eyebrow">AB GARAGE • AREA SISWA</p><h1>Dashboard Belajar</h1><p class="student-only">HALAMAN KHUSUS SISWA</p><p class="muted">Selamat datang, <strong id="studentName">—</strong></p></div><div class="top-actions"><a class="text-btn" href="index.html">Website</a><button class="primary-btn" id="logoutBtn">Keluar</button></div></header>
<section class="dash-grid"><article class="stat"><span class="muted">NIS</span><strong id="studentNis">—</strong></article><article class="stat"><span class="muted">Kelas</span><strong id="studentClass">—</strong></article><article class="stat"><span class="muted">Rata-rata nilai</span><strong id="avgScore">0</strong></article><article class="stat"><span class="muted">Modul selesai</span><strong id="completedCount">0/8</strong></article></section>
<section class="panel"><p class="eyebrow">PROGRES BELAJAR</p><h2>8 Modul AB Garage</h2><div class="module-grid" id="moduleGrid"></div></section>
<section class="panel" style="margin-top:18px"><p class="eyebrow">RIWAYAT EVALUASI SAYA</p><div id="attempts"><p class="muted">Memuat riwayat...</p></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script>
const modules=['Menyiapkan gambar teknik','Mesin Kendaraan','Pemindah Tenaga','Kelistrikan Mobil','Sistem Bahan Bakar','Tools dan Alat Ukur','Rem, Kemudi dan Suspensi','Diagnosis Kerusakan'];
const app=document.getElementById('studentApp');
async function init(){const current=await ABAuth.requireRole('student');if(!current)return;app.hidden=false;const p=current.profile;studentName.textContent=p.full_name||current.user.email;studentNis.textContent=p.nis||'—';studentClass.textContent=p.class_name||'—';logoutBtn.onclick=()=>ABAuth.logout();
const [pr,at]=await Promise.all([ABAuth.client.from('abg_module_progress').select('module_no,progress_percent,completed').eq('user_id',p.id),ABAuth.client.from('abg_evaluation_attempts').select('module_no,score,correct_answers,total_questions,submitted_at').eq('user_id',p.id).order('submitted_at',{ascending:false}).limit(30)]);if(pr.error)throw pr.error;if(at.error)throw at.error;
const progress=Object.fromEntries(pr.data.map(x=>[x.module_no,x]));moduleGrid.innerHTML=modules.map((name,i)=>{const x=progress[i+1]||{progress_percent:0,completed:false};return `<article class="module"><strong>Modul ${i+1}</strong><h3>${name}</h3><div class="bar"><i style="width:${Math.min(100,Math.max(0,Number(x.progress_percent)||0))}%"></i></div><small>${x.completed?'Selesai':'Belum selesai'} • ${x.progress_percent||0}%</small></article>`}).join('');
const scores=at.data.map(x=>Number(x.score)).filter(Number.isFinite);avgScore.textContent=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'0';completedCount.textContent=`${pr.data.filter(x=>x.completed).length}/8`;attempts.innerHTML=at.data.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th align="left">Modul</th><th>Nilai</th><th>Benar</th><th>Waktu</th></tr></thead><tbody>${at.data.map(x=>`<tr><td>Modul ${x.module_no}</td><td align="center"><strong>${Number(x.score).toFixed(1)}</strong></td><td align="center">${x.correct_answers}/${x.total_questions}</td><td align="right">${new Date(x.submitted_at).toLocaleString('id-ID')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Belum ada evaluasi.</p>'}
init().catch(e=>{console.error(e);app.hidden=false;app.innerHTML='<section class="panel"><h2>Gagal memuat dashboard</h2><p class="danger">'+(e.message||'Terjadi kesalahan')+'</p><a class="text-btn" href="login.html">Kembali ke login</a></section>'});
</script></body></html>
