name: Validasi Website AB Garage

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Periksa sintaks JavaScript
        shell: bash
        run: |
          set -e
          for file in ./*.js; do
            echo "Memeriksa $file"
            node --check "$file"
          done
      - name: Periksa referensi aset lokal dan ID HTML
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import sys

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.assets = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  for key in ("src", "href"):
                      value = attrs.get(key, "")
                      if value and tag in ("script", "img", "link") and not value.startswith(("#", "data:", "http:", "https:", "//", "mailto:")):
                          self.assets.append(value.split("?")[0])
          parser = Audit()
          parser.feed(html)
          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          missing = sorted({asset for asset in parser.assets if not (root / asset).is_file()})
          if duplicates:
              print("ID HTML duplikat:", ", ".join(duplicates))
          if missing:
              print("Aset lokal tidak ditemukan:", ", ".join(missing))
          if duplicates or missing:
              sys.exit(1)
          print("Pemeriksaan HTML dan aset lokal lulus.")
